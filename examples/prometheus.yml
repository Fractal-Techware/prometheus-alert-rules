# Minimal Prometheus configuration that loads the rules from this repository.
# Merge the `rule_files` entry into your own prometheus.yml.

global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/rules/*.yml

# Point this at your Alertmanager to receive notifications.
# alerting:
#   alertmanagers:
#     - static_configs:
#         - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # Host alerts expect node_exporter under one of the job names
  # node | node-exporter | node_exporter | prometheus-node-exporter.
  - job_name: node
    static_configs:
      - targets: ["node-exporter:9100"]
