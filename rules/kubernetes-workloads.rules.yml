# Free sample of the Fractal Techware Prometheus Alert Rules & Runbook Pack (MIT).
# Full pack (179 rules, 364 tests): https://store.fractaltechware.com/l/prometheus-alert-rules-pack?utm_source=github&utm_medium=rules&utm_campaign=free-repo
groups:
  - name: ftw.kubernetes-workloads.alerts
    rules:
      - alert: KubePodCrashLooping
        expr: max_over_time(kube_pod_container_status_waiting_reason{job="kube-state-metrics", namespace=~".+", reason="CrashLoopBackOff"}[5m]) >= 1
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: Pod container is crash looping.
          description: Container {{ $labels.container }} in pod {{ $labels.namespace }}/{{ $labels.pod }} has been in CrashLoopBackOff for at least 15m.
          runbook_url: runbooks/kubernetes-workloads/KubePodCrashLooping.md
      - alert: KubePodNotReady
        expr: |-
          max by (cluster, namespace, pod) (kube_pod_status_phase{job="kube-state-metrics", namespace=~".+", phase=~"Pending|Unknown|Failed"}) > 0
          unless on (cluster, namespace, pod)
          max by (cluster, namespace, pod) (kube_pod_owner{job="kube-state-metrics", owner_kind="Job"})
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: Pod has been in a non-ready state.
          description: Pod {{ $labels.namespace }}/{{ $labels.pod }} has been Pending, Unknown or Failed for longer than 15m.
          runbook_url: runbooks/kubernetes-workloads/KubePodNotReady.md
      - alert: KubeContainerOOMKilled
        expr: |-
          (increase(kube_pod_container_status_restarts_total{job="kube-state-metrics", namespace=~".+"}[10m]) >= 1)
          and on (cluster, namespace, pod, container)
          (kube_pod_container_status_last_terminated_reason{job="kube-state-metrics", reason="OOMKilled"} == 1)
        keep_firing_for: 10m
        labels:
          severity: warning
        annotations:
          summary: Container was OOM killed.
          description: Container {{ $labels.container }} in pod {{ $labels.namespace }}/{{ $labels.pod }} restarted after being killed for exceeding its memory limit.
          runbook_url: runbooks/kubernetes-workloads/KubeContainerOOMKilled.md
      - alert: KubeImagePullBackOff
        expr: max_over_time(kube_pod_container_status_waiting_reason{job="kube-state-metrics", namespace=~".+", reason=~"ImagePullBackOff|ErrImagePull|InvalidImageName"}[5m]) >= 1
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: Container image cannot be pulled.
          description: Container {{ $labels.container }} in pod {{ $labels.namespace }}/{{ $labels.pod }} is waiting with reason {{ $labels.reason }}.
          runbook_url: runbooks/kubernetes-workloads/KubeImagePullBackOff.md
      - alert: KubeDeploymentReplicasMismatch
        expr: |-
          (kube_deployment_spec_replicas{job="kube-state-metrics", namespace=~".+"} > kube_deployment_status_replicas_available{job="kube-state-metrics", namespace=~".+"})
          and
          (changes(kube_deployment_status_replicas_updated{job="kube-state-metrics", namespace=~".+"}[10m]) == 0)
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: Deployment has fewer available replicas than desired.
          description: Deployment {{ $labels.namespace }}/{{ $labels.deployment }} has had fewer available replicas than the desired {{ $value | humanize }} for longer than 15m, and no rollout is progressing.
          runbook_url: runbooks/kubernetes-workloads/KubeDeploymentReplicasMismatch.md
      - alert: KubeDeploymentRolloutStuck
        expr: kube_deployment_status_condition{job="kube-state-metrics", namespace=~".+", condition="Progressing", status="false"} != 0
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: Deployment rollout is not progressing.
          description: Rollout of deployment {{ $labels.namespace }}/{{ $labels.deployment }} has exceeded its progress deadline and has not progressed for 15m.
          runbook_url: runbooks/kubernetes-workloads/KubeDeploymentRolloutStuck.md
