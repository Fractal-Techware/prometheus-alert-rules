name: promtool tests

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  promtool:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Pull Prometheus image (promtool)
        run: docker pull --quiet prom/prometheus:v3.14.0

      - name: promtool check rules + test rules
        run: USE_DOCKER=1 ./run-tests.sh
